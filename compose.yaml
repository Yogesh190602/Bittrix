# Fixed project name, so the container is the same one whatever the folder
# this is checked out in is called.
name: bittrix-technologies

services:
  bittrix-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Read from .env beside this file (copy .env.example). Without it the
        # contact form says online enquiries are not connected.
        VITE_CONTACT_ENDPOINT: ${VITE_CONTACT_ENDPOINT:-}
    container_name: bittrix-web
    # The reverse proxy in front of it (journal-nginx, ports 80/443 and
    # HTTPS) is itself a container, so it reaches this one by name,
    # http://bittrix-web, on its own Docker network.
    networks:
      - proxy
    # Also on this server's loopback, for checking it with curl.
    ports:
      - "127.0.0.1:8080:80"
    restart: unless-stopped

networks:
  # Created by the journal project's compose (/var/www/journal).
  proxy:
    name: journal_journal-net
    external: true
