server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Redirects stay relative, so behind the reverse proxy they keep the
    # visitor's https and domain instead of pointing at this container.
    absolute_redirect off;

    # Every page is prerendered to <route>/index.html: /about is served from
    # about/index.html directly, with or without the trailing slash.
    location / {
        try_files $uri $uri/index.html =404;
        # Pages are checked for a newer version on each visit.
        add_header Cache-Control "no-cache";
    }

    # Build files carry a content hash in their name, so they never change.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The site's own "page not found" page.
    error_page 404 /404.html;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
}
